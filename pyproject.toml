[project]
name = "toolbox-images-migration"
version = "0.2.0"
description = "A utility to relocate images from a Website Toolbox forum"
readme = "README.md"
requires-python = ">=3.11, <4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ricardo Newbery", email = "ric@digitalmarbles.com" }]
dependencies = [
    "requests>=2.28.1,<3.0.0",
    "alive-progress>=3.3.0,<4.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "beautifulsoup4>=4.11.1,<5.0.0",
    "requests-file>=3.0.1,<4.0.0",
    "plumbum>=1.8.0,<2.0.0",
]

[project.scripts]
toolbox = "toolbox.cli:main"

[project.urls]
Repository = "https://github.com/newbery/toolbox-images-migration"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "coverage (>=7.15.4,<8.0.0)",
    "ruff>=0.16.0,<0.17.0",
    "pyright>=1.1.0,<2.0.0",
    "pdbpp>=0.11.0,<1.0.0",
    "poethepoet (>=0.48.0,<0.49.0)",
]

[tool.poetry]
requires-poetry = ">=2.2.0"
packages = [{ include = "toolbox", from = "src" }]

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E", "F", "B", "I", "S", "UP", "RUF", "PT"]
ignore = [
    "class-as-data-structure",
    "line-too-long",
    "assert",
]
unfixable = ["unused-import"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportIncompatibleMethodOverride = "warning"
reportMissingTypeStubs = false
reportPrivateImportUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
ignore_errors = true

[tool.coverage.html]
directory = "_coverage"

[tool.poe.env]
COVERAGE_REPORT = "file://${POE_ROOT}/_coverage/index.html"

[tool.poe.tasks]
check = ["poetry-check", "lint", "format-check", "typecheck", "test"]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "pyright"
test = "pytest"

coverage = [
    { cmd = "coverage run -m pytest" },
    { cmd = "coverage report" },
    { cmd = "coverage html" },
    { cmd = "python -m webbrowser -t ${COVERAGE_REPORT}" },
]

poetry-check = "poetry check"
